# Site settings
title: Max Rintoul
email: max.rintoul@utas.edu.au
url: https://maxrintoul.github.io/
description: "Max Rintoul - coastal biogeochemist working across coral reefs and sediments, through both models and observations."
keywords: "biogeochemistry, sediment, coral reefs"
skills: "Marine Biogeochemist"
meta_author: Rintoul Max

# Google webmaster tools
google_verify:

# https://ssl.bing.com/webmaster/configure/verify/ownership Option 2 content= goes here
bing_verify:

# Contact form: create a form at https://formspree.io and paste its ID here
# (the part after /f/ in the endpoint). While this is empty the contact
# section shows a plain email link instead of a form.
formspree_id:

# Color settings (hex-codes without the leading hash-tag)
color:
  primary: 18bc9c #80B3FF
  primary-rgb: "24,188,156" #"128,179,255"
  secondary: 2c3e50 #FD6E8A
  secondary-dark: 233140 #A2122F

# Footer settings
footer:
  copyright: Dr. Max Rintoul
  location: Location
  social: Elsewhere
  # credits: Credits

# Social networks usernames (icons come from Font Awesome brands, e.g. orcid, researchgate, linkedin, google-scholar)
social:
  - title: github
    url: https://github.com/maxrintoul
  # - title: orcid
  #   url: https://orcid.org/0000-0000-0000-0000
  # - title: linkedin
  #   url: https://www.linkedin.com/in/your-name

# Address (add as many lines as necessary)
address:
  - line: University of Tasmania
  - line: Tasmania, Australia

# Credits content
credits: 'Freelancer is a free to use, open source Bootstrap theme created by <a href="http://startbootstrap.com">Start Bootstrap</a>.'

# Build settings
markdown: kramdown
permalink: pretty

#for posts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      permalink: ""

# Files Jekyll should not publish
exclude:
  - ChatGPT Image*.png
  - Gemfile
  - Rakefile
  - freelancer-theme-jekyll.gemspec
  - screenshot.png
  - mail
  # leftover Freelancer demo posts, safe to delete
  - _posts/2014-07-13-project-6.markdown
  - _posts/2014-07-14-project-5.markdown
  - _posts/2014-07-15-project-4.markdown
  - _posts/2014-07-16-project-3.markdown
  - _posts/2014-07-17-project-2.markdown
  - _posts/2014-07-18-project-1.markdown
